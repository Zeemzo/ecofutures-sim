plugins {
    id "com.android.application"
}

def pkg = new groovy.json.JsonSlurper().parse(file("../../package.json"))
def (major, minor, patch) = pkg.version.tokenize(".").collect { it as int }

android {
    namespace "org.ecofutures.simulator"
    compileSdk 35

    defaultConfig {
        applicationId "org.ecofutures.simulator"
        minSdk 26
        targetSdk 35
        versionName pkg.version
        versionCode major * 10000 + minor * 100 + patch
        // the chain ships as a native library for these two: phones and tablets, and the x86_64 emulator
        ndk { abiFilters "arm64-v8a", "x86_64" }
    }

    buildTypes {
        release {
            minifyEnabled false
            // for installing on your own devices: signed with this machine's debug key, not a store key
            signingConfig signingConfigs.debug
        }
    }

    // anvil is shipped as lib/<abi>/libanvil.so and extracted on install, to the one app directory Android
    // still lets an app run a program from
    packaging { jniLibs { useLegacyPackaging true } }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}
